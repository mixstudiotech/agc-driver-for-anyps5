[workspace]
members = ["runtime", "shader", "pm4-proc", "pm4-proc/defs", "isa-proc", "isa-proc/defs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[profile.release]
debug = 1

# The proc-macros (pm4-proc, isa-proc) parse Mesa's and AMD's definitions on every build of
# the crates that use them: build them and their dependencies optimised.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
