[package]
name = "isa-proc"
description = "AMD shader ISA definitions generated from AMD's machine-readable ISA XML (decisions D18)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
